# Fragmento de Nginx para servir las fuentes Owee (oweeme.com, mibolivia.online, ...).
# Colocalo dentro del bloque server { } de cada sitio.
location ~* \.(woff2|woff|ttf|otf)$ {
    add_header Access-Control-Allow-Origin "*";          # permite usar las fuentes desde otros dominios tuyos
    add_header Cache-Control "public, max-age=31536000, immutable";
    types { font/woff2 woff2; font/woff woff; font/ttf ttf; font/otf otf; }
}
# Si usas Content-Security-Policy, permite las fuentes propias:  font-src 'self' data:;
