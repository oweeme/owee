<!doctype html><html lang="es"><meta charset="utf-8"><title>Owee Sans 1.0 Demo</title>
<style>@font-face{font-family:OweeSans;src:url('OweeSans-Regular.woff2') format('woff2')}body{font-family:system-ui;max-width:900px;margin:40px auto;padding:0 20px}textarea{width:100%;font-size:22px;padding:12px}#out{font-family:OweeSans;font-size:52px;line-height:1.5;border:1px solid #bbb;padding:20px;min-height:90px}code{background:#eee;padding:2px 5px}</style>
<h1>Owee Sans 1.0 — prueba Roman → Script</h1><p>Escribe, por ejemplo: <code>me suna nume</code>, <code>nara</code> o <code>meka mado</code>.</p>
<textarea id="in">me suna nume</textarea><h2>Owee Script</h2><div id="out"></div>
<script>const M={"a": "", "e": "", "o": "", "u": "", "pa": "", "pe": "", "po": "", "pu": "", "ba": "", "be": "", "bo": "", "bu": "", "ta": "", "te": "", "to": "", "tu": "", "da": "", "de": "", "do": "", "du": "", "ka": "", "ke": "", "ko": "", "ku": "", "ga": "", "ge": "", "go": "", "gu": "", "fa": "", "fe": "", "fo": "", "fu": "", "sa": "", "se": "", "so": "", "su": "", "ma": "", "me": "", "mo": "", "mu": "", "na": "", "ne": "", "no": "", "nu": "", "la": "", "le": "", "lo": "", "lu": "", "ra": "", "re": "", "ro": "", "ru": "", "sha": "", "she": "", "sho": "", "shu": "", "cha": "", "che": "", "cho": "", "chu": ""}; const cons=['sh','ch','p','b','t','d','k','g','f','s','m','n','l','r'];
function word(w){let i=0,o='';w=w.toLowerCase();while(i<w.length){let c='';if(w.slice(i,i+2)=='sh'||w.slice(i,i+2)=='ch'){c=w.slice(i,i+2);i+=2}else if(cons.includes(w[i])){c=w[i++]}let v=w[i];if(!'aeou'.includes(v||''))return null;i++;let s=c+v;if(!M[s])return null;o+=M[s]}return o}
function convert(t){return t.split(/(\s+|[.,!?;:()\-]+)/).map(x=>{if(!x||/^\s+$/.test(x)||/^[.,!?;:()\-]+$/.test(x))return x;return word(x)||x}).join('')}
const inp=document.getElementById('in'),out=document.getElementById('out');function go(){out.textContent=convert(inp.value)}inp.oninput=go;go();</script></html>
