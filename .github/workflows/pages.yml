name: Publicar el sitio de Owee

# Publica en GitHub Pages el sitio publico (aprender, leer, ciencias, descargas). La seccion "Proyecto"
# (registro maestro, estado, auditoria, plan) NO se publica: es material de trabajo interno.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar el sitio publico
        run: OWEE_PUBLICO=1 python3 -W ignore 07_Sitio_Web/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 07_Sitio_Web/docs

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
